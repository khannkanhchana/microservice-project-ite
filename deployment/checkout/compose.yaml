services:
  postgres:
    image: postgres:17-alpine
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    ports:
      - "127.0.0.1:55433:5432"
    environment:
      POSTGRES_DB: checkout
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout -d checkout"]
      interval: 2s
      timeout: 3s
      retries: 30
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27029:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }; if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 2s
      timeout: 5s
      retries: 30
