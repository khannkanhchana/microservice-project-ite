services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: eureka_experiments
      POSTGRES_USER: experiment
      POSTGRES_PASSWORD: experiment
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experiment -d eureka_experiments"]
      interval: 2s
      timeout: 3s
      retries: 30
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27028:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }; if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 2s
      timeout: 3s
      retries: 30
