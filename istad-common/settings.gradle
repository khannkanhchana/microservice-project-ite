pluginManagement {
    includeBuild('../build-logic')

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

    repositories {
        mavenCentral()

        maven {
            name = 'buf'
            url = uri('https://buf.build/gen/maven')
        }
    }

    versionCatalogs {
        libs {
            from(files("../gradle/libs.versions.toml"))
        }
    }
}
rootProject.name = 'istad-common'
include 'istad-common-domain'
include 'istad-common-restapi'
include 'istad-common-swagger'
include 'istad-common-webflux'
include 'istad-common-grpc'
