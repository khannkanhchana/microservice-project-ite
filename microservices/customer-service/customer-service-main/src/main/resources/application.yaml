spring:
  application:
    name: customer-service
  main:
    web-application-type: reactive
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_ISSUER:http://localhost:9000}
          jwk-set-uri: ${AUTH_SERVER_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  r2dbc:
    url: ${CUSTOMER_DB_URL:r2dbc:postgresql://localhost:5432/mongo-customer_db}
    username: ${CUSTOMER_DB_USERNAME:postgres}
    password: ${CUSTOMER_DB_PASSWORD:111999}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/customer-schema.sql
  cloud:
    consul:
      discovery:
        instance-id: ${spring.application.name}-${random.value}
        prefer-ip-address: true
        health-check-path: /actuator/health

server:
  port: 9091
