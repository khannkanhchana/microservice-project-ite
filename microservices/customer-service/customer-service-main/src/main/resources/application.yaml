spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 111999
    url: jdbc:postgresql://localhost:5432/mongo-customer_db
  application:
    name: customer-service

server:
  port: 9091

  cloud:
    consul:
      discovery:
        instance-id: ${spring.application.name}-${random.value}

