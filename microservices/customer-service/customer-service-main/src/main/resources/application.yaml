spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${CUSTOMER_DB_USERNAME:checkout}
    password: ${CUSTOMER_DB_PASSWORD:checkout}
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:55433/customer_db}
  application:
    name: customer-service

server:
  port: 9091

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

