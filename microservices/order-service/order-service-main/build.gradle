plugins {
    id 'spring-boot-common-conventions'
    id 'spring-cloud-common-conventions'
}
ext {
    springCloudVersion = "2025.1.4"
}

dependencies {
    implementation 'com.scalar.maven:scalar:0.4.4'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.1'
    implementation 'kh.edu.istad:order-service-client'
    implementation project(':order-service-restapi')
    implementation project(':order-service-persistence')
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework:spring-webmvc:7.0.9'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // add Eureka Client
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    // add actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

}
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion"
    }
}
