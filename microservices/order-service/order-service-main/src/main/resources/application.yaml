spring:
  main:
    web-application-type: reactive
  security:
    oauth2:
      client:
        registration:
          customer-service:
            provider: authorization-server
            client-id: ${OAUTH2_CLIENT_ID:order-client}
            client-secret: ${OAUTH2_CLIENT_SECRET:order-secret}
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
            scope: customer.read
          business-service:
            provider: authorization-server
            client-id: ${BUSINESS_OAUTH2_CLIENT_ID:business-client}
            client-secret: ${BUSINESS_OAUTH2_CLIENT_SECRET:business-secret}
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
            scope: business.read
        provider:
          authorization-server:
            token-uri: ${AUTH_SERVER_TOKEN_URI:http://localhost:9000/oauth2/token}
  #add r2dbc
  r2dbc:
    url: r2dbc:postgresql://localhost:9543/db_order
    username: iteuser
    password: qwerqwer
  liquibase:
    enabled: true
    url: jdbc:postgresql://localhost:9543/db_order
    user: iteuser
    password: qwerqwer
    change-log: classpath:db/changelog/db_changelog-master.yaml

  # add name of application
  application:
    name: order-service

  profiles:
    active: dev
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: localhost
      port: 8500
      config:
        enabled: true
        format: yaml
        watch:
          enabled: true
      discovery:
        enabled: true
        register: true
        service-name: order-service
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 15s
        register-health-check: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    driver-class-name: org.postgresql.Driver
    username: iteuser
    password: qwerqwer
    url: jdbc:postgresql://localhost:9543/db_order
  jackson:
    deserialization:
      fail-on-unknown-properties: true


eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

service:
  message: "Order service is running"
  version: "1.0.0"
  env: "dev"

customer:
  service:
    base-url: ${CUSTOMER_SERVICE_URL:http://localhost:9091}

business:
  service:
    base-url: ${BUSINESS_SERVICE_URL:http://localhost:9092}


