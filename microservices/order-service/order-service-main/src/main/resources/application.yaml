spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${ORDER_DB_USERNAME:checkout}
    password: ${ORDER_DB_PASSWORD:checkout}
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:55433/order_db}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name:  order-service
server:
  port: 9094

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info


scalar:
  enabled: true
  url: /v3/api-docs
  path: /scalar
