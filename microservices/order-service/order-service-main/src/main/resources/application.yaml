spring:
  #add r2dbc
  r2dbc:
    url: r2dbc:postgresql://localhost:9543/db_order
    username: iteuser
    password: qwerqwer
  liquibase:
    enabled: true
    url: jdbc:postgresql://localhost:9543/db_order
    user: iteuser
    password: qwerqwer
    change-log: classpath:db/changelog/db_changelog-master.yaml

  # add name of application
  application:
    name: order-service

  profiles:
    active: dev
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: localhost
      port: 8500
      config:
        enabled: true
        format: yaml
        watch:
          enabled: true
      discovery:
        enabled: true
        register: true
        service-name: order-service
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 15s
        register-health-check: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    driver-class-name: org.postgresql.Driver
    username: iteuser
    password: qwerqwer
    url: jdbc:postgresql://localhost:9543/db_order
  jackson:
    deserialization:
      fail-on-unknown-properties: true


eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

service:
  message: "Order service is running"
  version: "1.0.0"
  env: "dev"




#port 9094
