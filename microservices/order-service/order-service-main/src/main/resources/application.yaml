spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 111999
    url: jdbc:postgresql://localhost:5432/mongo-customer_db

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  application:
    name: order-service

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        register: true
        service-name: order-service
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 15s
        register-health-check: true

server:
  port: 9094

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

scalar:
  enabled: true
  url: /v3/api-docs
  path: /scalar

