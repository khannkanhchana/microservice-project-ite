plugins {
    id 'spring-common-conventions'
    id 'spring-cloud-common-conventions'
}

repositories {
    mavenCentral()
    maven {
        name = 'buf'
        url = 'https://buf.build/gen/maven'
    }
}

dependencies {

    implementation 'build.buf.gen:kanhchana_grpc_protocolbuffers_java:36.2.0.1.20261106083016.ec63a9d9e198'
    implementation 'build.buf.gen:kanhchana_grpc_grpc_java:1.85.1.1.20261106083016.ec63a9d9e198'
    implementation 'com.google.protobuf:protobuf-java:4.36.2'

    // gRPC Client Starter (Only client needed, NO server starter here)
    implementation libs.grpc.client.spring.boot.starter
    implementation libs.grpc.protobuf
    implementation libs.grpc.stub

    implementation project(':order-service-domain:order-application-service')

    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    implementation libs.spring.boot.starter.webflux
    implementation libs.reactor.core

    // implementation 'org.springframework.boot:spring-boot-starter-webclient'

    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'com.github.ben-manes.caffeine:caffeine'

}
