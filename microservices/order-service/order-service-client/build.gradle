plugins {
    id 'spring-common-conventions'
    id 'spring-cloud-common-conventions'
    alias(libs.plugins.protobuf)
}

dependencies {

    // gRPC Client Starter (Only client needed, NO server starter here)
    implementation libs.grpc.client.spring.boot.starter
    implementation libs.grpc.protobuf
    implementation libs.grpc.stub

    implementation "kh.edu.istad:order-application-service"

    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    implementation libs.spring.boot.starter.webflux
    implementation libs.reactor.core

    // implementation 'org.springframework.boot:spring-boot-starter-webclient'

    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'com.github.ben-manes.caffeine:caffeine'

}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.get()}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${libs.versions.grpc.get()}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}