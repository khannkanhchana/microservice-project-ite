pluginManagement {
    includeBuild('../../build-logic')
    repositories { gradlePluginPortal();
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

    repositories {
        mavenCentral()

        maven {
            name = 'buf'
            url = uri('https://buf.build/gen/maven')
        }
    }

    versionCatalogs {
        libs {
            from(
                    files("../../gradle/libs.versions.toml")
            )
        }
    }
}
rootProject.name = 'order-service'

include 'order-service-domain:order-application-service'
include 'order-service-domain:order-domain-core'
include 'order-service-persistence'
include 'order-service-restapi'
include 'order-service-main'
include 'order-service-client'

includeBuild('../../istad-common')
