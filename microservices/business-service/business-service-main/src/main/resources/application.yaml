spring:
  application:
    name: business-service
  mongodb:
    uri: ${BUSINESS_MONGODB_URI:mongodb://localhost:27029/business_db?replicaSet=rs0&directConnection=true}
    representation:
      uuid: standard
server:
  port: 9092

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
