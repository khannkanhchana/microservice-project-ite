plugins {
    id 'spring-boot-common-conventions'
}

dependencies {
    implementation project(':business-service-restapi')
    implementation project(':business-service-persistence')
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation project(':business-service-domain:business-application-service')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
