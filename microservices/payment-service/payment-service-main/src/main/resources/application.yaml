
spring:
  application:
    name: payment-service
  mongodb:
    uri: ${PAYMENT_MONGODB_URI:mongodb://localhost:27029/payment_db?replicaSet=rs0&directConnection=true}
    representation:
      uuid: standard



server:
  port: 9093

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
