spring:
  application:
    name: payment-service

  data:
    mongodb:
      uri: mongodb://mongod:mongod@localhost:2026/payment_db?authSource=admin

  datasource:
    url: jdbc:postgresql://localhost:5432/mongo-customer_db
    username: postgres
    password: 111999
    driver-class-name: org.postgresql.Driver

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        register: true
        service-name: payment-service
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 15s
        register-health-check: true

server:
  port: 9093

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
