plugins {
    id 'spring-boot-common-conventions'
    id 'spring-cloud-common-conventions'
}
ext {
    springCloudVersion = "2025.1.4"
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'

    implementation project(':payment-service-restapi')
    implementation project(':payment-service-persistence')
    implementation project(':payment-service-application')
    implementation project(':payment-service-domain')

    implementation 'com.scalar.maven:scalar:0.4.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'io.projectreactor:reactor-test'

    // add eureka
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    // add actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'



}
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion"
    }
}
