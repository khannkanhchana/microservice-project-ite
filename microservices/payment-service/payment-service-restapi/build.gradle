plugins {
    id 'spring-common-conventions'
}

dependencies {

    implementation platform(
            'org.springframework.cloud:spring-cloud-dependencies:2025.1.4'
    )
    implementation project(':payment-service-application')
    implementation project(':payment-service-persistence')
    implementation project(':payment-service-domain')
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
}