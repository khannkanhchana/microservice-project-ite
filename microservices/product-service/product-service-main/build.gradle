plugins {
    id 'spring-boot-common-conventions'
}

dependencies {
    implementation project(':product-service-domain:product-application-service')
    implementation project(':product-service-grpc')
    implementation project(':product-service-persistence')
    implementation project(':product-service-restapi')

    // JPA + DB at runtime
    implementation libs.spring.boot.starter.data.jpa
    runtimeOnly libs.postgresql

    // Web
    implementation libs.spring.boot.starter.webmvc

    // Actuator
    implementation libs.spring.boot.starter.actuator

    testImplementation libs.spring.boot.starter.test.webmvc
}
