plugins {
    id 'spring-boot-common-conventions'
    alias(libs.plugins.protobuf)
}

dependencies {

    implementation libs.spring.boot.starter.webmvc

    // gRPC Spring Boot Starters
    implementation libs.grpc.server.spring.boot.starter
    implementation libs.grpc.client.spring.boot.starter

    // Core gRPC & Protobuf libraries
    implementation libs.grpc.protobuf
    implementation libs.grpc.stub
    implementation libs.grpc.services // Enables reflection

    // spring data
    implementation libs.spring.boot.starter.data.jpa
    runtimeOnly libs.postgresql

    testImplementation libs.spring.boot.starter.test.webmvc
    testImplementation libs.grpc.testing
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.5"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.68.1"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}