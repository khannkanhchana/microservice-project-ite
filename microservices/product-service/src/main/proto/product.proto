syntax = "proto3";

package kh.edu.istad.product.grpc;

option java_multiple_files = true;

option java_package = "kh.edu.istad.product.grpc";

option java_outer_classname = "ProductProto";
// ឈ្មោះ Class កណ្តាលដែលផ្ទុកនូវ Metadata និង Schema Definitions នៃ Proto ទាំងមូល។

service ProductGrpcService {
  rpc GetProductById (ProductRequest) returns (ProductResponse);
  rpc CreateProduct (CreateProductRequest) returns (ProductResponse);
}

message ProductRequest {
  string product_id = 1;
}

message CreateProductRequest {
  string name = 1;
  double price = 2;
  int32 quantity = 3;
}

message ProductResponse {
  string product_id = 1;
  string name = 2;
  double price = 3;
  int32 quantity = 4;
}