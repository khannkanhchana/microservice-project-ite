
plugins {
    id 'spring-boot-common-conventions'
}

description = 'IAM Spring Boot application and runtime wiring'

dependencies {
    implementation project(':iam-domain:iam-domain-core')
    implementation project(':iam-domain:iam-application-service')
    implementation project(':iam-persistence')
    implementation project(':iam-infrastructure')
    implementation project(':iam-rest-api')
    implementation project(':iam-web')

    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.postgresql:postgresql'

    // JTE Spring Boot 4 integration
    implementation 'gg.jte:jte-spring-boot-starter-4:3.2.5'

    testImplementation libs.spring.boot.starter.test.webmvc
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.security:spring-security-oauth2-jose'
}

tasks.named('bootRun') {
    workingDir projectDir.parentFile
}
