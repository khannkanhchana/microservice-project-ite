gg:
  jte:
    development-mode: true
    template-location: microservices/iam-service/iam-web/src/main/jte
    template-suffix: .jte
    class-directory: microservices/iam-service/build/jte-classes

server:
  port: 9000
  # Honour X-Forwarded-Proto/Host from ngrok so redirects stay on https://<ngrok-domain>
  # (required for the Telegram callback, which is registered on the ngrok URL).
  forward-headers-strategy: framework
