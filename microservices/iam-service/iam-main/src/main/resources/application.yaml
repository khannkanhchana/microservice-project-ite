
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
      - optional:file:../../../.env[.properties]

  application:
    name: iam-service

  messages:
    basename: messages
    encoding: UTF-8

  security:
    oauth2:
      authorizationserver:
        issuer: "http://localhost:9000"

      client:
        registration:
          google:
            provider: google
            client-id: ${IAM_GOOGLE_CLIENT_ID:}
            client-secret: ${IAM_GOOGLE_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

          github:
            provider: github
            client-id: ${IAM_GITHUB_CLIENT_ID:}
            client-secret: ${IAM_GITHUB_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - read:user
              - user:email

          facebook:
            provider: facebook
            client-id: ${IAM_FACEBOOK_CLIENT_ID:}
            client-secret: ${IAM_FACEBOOK_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - public_profile
              - email

          telegram:
            provider: telegram
            client-id: ${IAM_TELEGRAM_CLIENT_ID}
            client-secret: ${IAM_TELEGRAM_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            redirect-uri: "https://cautious-garment-wireless.ngrok-free.dev/login/oauth2/code/telegram"
            scope:
              - openid
              - profile

        provider:
          facebook:
            authorization-uri: "https://www.facebook.com/${IAM_FACEBOOK_GRAPH_VERSION:v26.0}/dialog/oauth"
            token-uri: "https://graph.facebook.com/${IAM_FACEBOOK_GRAPH_VERSION:v26.0}/oauth/access_token"
            user-info-uri: "https://graph.facebook.com/me?fields=id,name,first_name,last_name,email,picture"
            user-name-attribute: id

          telegram:
            issuer-uri: "https://oauth.telegram.org"
            user-name-attribute: sub

  datasource:
    url: jdbc:postgresql://localhost:9543/db_oauth2
    username: iteuser
    password: qwerqwer
    driver-class-name: org.postgresql.Driver

  liquibase:
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    driver-class-name: ${spring.datasource.driver-class-name}
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # Redis (deployment/redis): HTTP login sessions via Spring Session, and active device sessions.
  data:
    redis:
      host: ${IAM_REDIS_HOST:localhost}
      port: ${IAM_REDIS_PORT:6379}
      password: ${IAM_REDIS_PASSWORD:}
  session:
    timeout: ${IAM_SESSION_TIMEOUT:12h}
    data:
      redis:
        namespace: iam:http-session
        flush-mode: on-save

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

iam:
  web:
    # The iam-web React SPA (iam-web/frontend), built into this service and served at / (static/index.html).
    # Registered as the public PKCE client "iam-web".
    base-url: ${IAM_WEB_BASE_URL:http://localhost:9000}
    # Vite dev server (npm run dev) — also a valid redirect target while developing the UI.
    dev-url: ${IAM_WEB_DEV_URL:http://localhost:5173}
    allowed-origins: ${IAM_WEB_ALLOWED_ORIGINS:http://localhost:9000,http://127.0.0.1:9000,http://localhost:5173,http://127.0.0.1:5173}
  admin:
    # Usernames or emails that get the ADMIN role at startup (comma-separated), e.g. IAM_BOOTSTRAP_ADMINS=alice
    bootstrap-users: ${IAM_BOOTSTRAP_ADMINS:}
  account:
    geoip:
      # Resolve session/login locations through ip-api.com. Off by default: it sends client IPs to a third party.
      enabled: ${IAM_GEOIP_ENABLED:false}
  authorization-server:
    dcr:
      registrar-client-id: ${IAM_DCR_REGISTRAR_CLIENT_ID:registrar-client}
      registrar-client-secret: ${IAM_DCR_REGISTRAR_CLIENT_SECRET:dev-registrar-secret}

