plugins { id 'spring-common-conventions' }

description = 'IAM web pages, web controllers, and internationalization'

dependencies {
    implementation project(':iam-domain:iam-application-service')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'gg.jte:jte-spring-boot-starter-4:3.2.4'
}
