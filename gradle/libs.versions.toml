[versions]

# Java
java-version = "25"
java-version-21 = "21"
java-version-17 = "17"

# Spring Ecosystem
spring-boot = "4.1.1"
spring-cloud = "2025.1.4"
dependency-management = "1.1.7"
spring-openapi = "3.2.0"
spring-authorization-server = "1.3.4"

# Dependencies
lombok = "1.18.40"
mapstruct = "1.6.3"
mapstruct-binding = "0.2.0"
junit-platform = "1.11.4"

# gRPC and Protocol Buffer
grpc = "1.83.1"
protobuf = "3.25.5"
protobufPlugin = "0.9.4"
grpcSpringBootStarter = "3.1.0.RELEASE"


[libraries]

# Gradle Plugin Dependencies
boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "dependency-management" }

# Lombok & MapStruct
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
mapstruct-annotation-processor = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "mapstruct-binding" }

# Spring Boot Starters
spring-boot-starter-logging = { module = "org.springframework.boot:spring-boot-starter-logging" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-test-webmvc = { module = "org.springframework.boot:spring-boot-webmvc-test" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-test-webflux = { module = "org.springframework.boot:spring-boot-webflux-test" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }

# Jackson
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }

# Reactive & Database
reactor-core = { module = "io.projectreactor:reactor-core" }
spring-boot-starter-data-mongodb-reactive = { module = "org.springframework.boot:spring-boot-starter-data-mongodb-reactive" }
spring-boot-starter-data-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

# gRPC
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-services = { module = "io.grpc:grpc-services", version.ref = "grpc" }
grpc-testing = { module = "io.grpc:grpc-testing", version.ref = "grpc" }

# Protocol Buffer
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }

# gRPC Spring Boot Starters
grpc-server-spring-boot-starter = { module = "net.devh:grpc-server-spring-boot-starter", version.ref = "grpcSpringBootStarter" }
grpc-client-spring-boot-starter = { module = "net.devh:grpc-client-spring-boot-starter", version.ref = "grpcSpringBootStarter" }

# Testing
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

# BOMs
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }

# Spring Cloud
spring-cloud-config-server = { module = "org.springframework.cloud:spring-cloud-config-server" }
spring-cloud-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway" }
spring-cloud-starter-eureka-server = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-server" }
spring-cloud-starter-eureka-client = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client" }
spring-cloud-starter-loadbalancer = { module = "org.springframework.cloud:spring-cloud-starter-loadbalancer" }
spring-cloud-starter-consul-discovery = { module = "org.springframework.cloud:spring-cloud-starter-consul-discovery" }
spring-cloud-starter-consul-config = { module = "org.springframework.cloud:spring-cloud-starter-consul-config" }
spring-vault-core = { module = "org.springframework.vault:spring-vault-core" }

# Springdoc
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "spring-openapi" }
springdoc-openapi-starter-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "spring-openapi" }

# OAuth2
spring-boot-starter-security-oauth2-authorization-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-jcl = { module = "org.springframework:spring-jcl" }

# Liquibase
spring-boot-starter-liquibase = { module = "org.springframework.boot:spring-boot-starter-liquibase" }


[bundles]

spring-base = [
    "spring-boot-starter-logging",
    "spring-boot-starter-actuator"
]

mapstruct = [
    "mapstruct-processor",
    "mapstruct-annotation-processor"
]

grpc-common = [
    "grpc-protobuf",
    "grpc-stub"
]


[plugins]

java-common-conventions = { id = "java-common-conventions" }
spring-common-conventions = { id = "spring-common-conventions" }
spring-boot-common-conventions = { id = "spring-boot-common-conventions" }

protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }

spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.gradle:dependency-management-plugin", version.ref = "dependency-management" }
