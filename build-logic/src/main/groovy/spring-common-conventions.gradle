plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

group = 'kh.edu.istad'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.1'
    }
}

dependencies {
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    compileOnly 'org.mapstruct:mapstruct:1.6.3'
    compileOnly 'org.projectlombok:lombok'

    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Keep method parameter names in bytecode: Spring MVC binds @PathVariable/@RequestParam by name and fails with
// "parameter name information not available" when classes are built without it (IDE builds add it; Gradle doesn't).
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}
