plugins {
    id 'java-library'
}

group = 'kh.edu.istad'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

tasks.named('test', Test) {
    useJUnitPlatform()
}









// Keep method parameter names in bytecode: Spring MVC binds @PathVariable/@RequestParam by name and fails with
// "parameter name information not available" when classes are built without it (IDE builds add it; Gradle doesn't).
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}
